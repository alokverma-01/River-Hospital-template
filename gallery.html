<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Gallery | {{name}}</title>
  <meta name="description" content="Photos of our facilities, teams and community events.">
  <meta name="theme-color" content="#1f6f66">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    /* Runs before paint: motion preference + first-visit loader */
    (function (h) {
      var off = false, rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { off = localStorage.getItem("motion") === "off"; } catch (e) {}
      h.classList.add("js");
      if (off) h.classList.add("reduce-motion");
      try { if (!off && !rm && !sessionStorage.getItem("seenLoader")) h.classList.add("show-loader"); } catch (e) {}
    })(document.documentElement);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.1/css/glightbox.min.css">
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <!-- Content (edit assets/js/config.js), then libraries, then site scripts -->
  <script defer src="assets/js/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script defer src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.3.1/js/glightbox.min.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/motion.js"></script>
</head>
<body data-page="gallery">
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="page-hero-line" data-pulse aria-hidden="true"></div>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li aria-current="page">Gallery</li></ol></nav>
        <h1 data-split>Take a look inside</h1>
        <p class="lead" data-hero>Our wards, equipment, people and community events. Select any photo to view it full size.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="filters" id="galleryFilters" role="group" aria-label="Filter photos"></div>
        <div class="masonry" id="masonry" data-reveal-group></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band" data-reveal-scale>
          <svg class="cta-line" viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 110 H210 L235 60 L265 170 L300 20 L330 185 L352 110 H600"/></svg>
          <div><h2>Visiting someone?</h2><p><span data-bind="visitingHours"></span></p></div>
          <div class="btn-group"><a class="btn btn-brand magnetic" href="contact.html"><i data-lucide="map-pin" aria-hidden="true"></i>Get directions</a><a class="btn btn-ghost" href="appointment.html"><i data-lucide="calendar-check" aria-hidden="true"></i>Book online</a></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
