<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found | {{name}}</title>
  <meta name="description" content="Page not found.">
  <meta name="theme-color" content="#1f6f66">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    /* Runs before paint: motion preference + first-visit loader */
    (function (h) {
      var off = false, rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { off = localStorage.getItem("motion") === "off"; } catch (e) {}
      h.classList.add("js");
      if (off) h.classList.add("reduce-motion");
      try { if (!off && !rm && !sessionStorage.getItem("seenLoader")) h.classList.add("show-loader"); } catch (e) {}
    })(document.documentElement);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@400..800&display=swap">
  
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <!-- Content (edit assets/js/config.js), then libraries, then site scripts -->
  <script defer src="assets/js/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script defer src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/motion.js"></script>
</head>
<body data-page="404">
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="page-hero-line" data-pulse aria-hidden="true"></div>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li aria-current="page">Page not found</li></ol></nav>
        <h1 data-split>We couldn't find that page</h1>
        <p class="lead" data-hero>The link may be old or mistyped. Try one of these instead.</p>
      </div>
    </section>
    <section class="section-tight"><div class="container" style="display:flex;flex-wrap:wrap;gap:.75rem">
      <a class="btn btn-accent" href="appointment.html"><i data-lucide="calendar-check" aria-hidden="true"></i>Book appointment</a>
      <a class="btn btn-ghost" href="index.html"><i data-lucide="house" aria-hidden="true"></i>Home</a>
      <a class="btn btn-ghost" href="doctors.html"><i data-lucide="user-round" aria-hidden="true"></i>Doctors</a>
    </div></section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
