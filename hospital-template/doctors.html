<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Doctors | {{name}}</title>
  <meta name="description" content="Meet our specialist doctors and book an appointment.">
  <meta name="theme-color" content="#1f6f66">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <script>
    /* Runs before paint: motion preference + first-visit loader */
    (function (h) {
      var off = false, rm = matchMedia("(prefers-reduced-motion: reduce)").matches;
      try { off = localStorage.getItem("motion") === "off"; } catch (e) {}
      h.classList.add("js");
      if (off) h.classList.add("reduce-motion");
      try { if (!off && !rm && !sessionStorage.getItem("seenLoader")) h.classList.add("show-loader"); } catch (e) {}
    })(document.documentElement);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Figtree:wght@400..800&display=swap">
  
  <link rel="stylesheet" href="assets/css/theme.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/animations.css">

  <!-- Content (edit assets/js/config.js), then libraries, then site scripts -->
  <script defer src="assets/js/config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/SplitText.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.26/dist/lenis.min.js"></script>
  <script defer src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>

  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/render.js"></script>
  <script defer src="assets/js/motion.js"></script>
</head>
<body data-page="doctors">
  <div id="site-header"></div>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="page-hero-line" data-pulse aria-hidden="true"></div>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li aria-current="page">Doctors</li></ol></nav>
        <h1 data-split>Find your doctor</h1>
        <p class="lead" data-hero>Filter by department, search by name or language, and book directly with the specialist you choose.</p>
      </div>
    </section>

    <section class="section-tight">
      <div class="container">
        <div class="filters" id="doctorFilters" role="group" aria-label="Filter by department"></div>
        <div class="filters" style="margin-top:-1rem">
          <p id="doctorCount" class="muted" aria-live="polite" style="margin:0;font-weight:600"></p>
          <label class="search"><span class="visually-hidden">Search doctors</span><i data-lucide="search" aria-hidden="true"></i><input id="doctorSearch" type="search" placeholder="Search name or language" autocomplete="off"></label>
        </div>
        <div class="doctor-grid" id="doctorGrid" data-reveal-group></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="cta-band" data-reveal-scale>
          <svg class="cta-line" viewBox="0 0 600 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 110 H210 L235 60 L265 170 L300 20 L330 185 L352 110 H600"/></svg>
          <div><h2>Don't know who to see?</h2><p>Book with any available doctor in a department and we'll match you with the first free specialist.</p></div>
          <div class="btn-group"><a class="btn btn-brand magnetic" href="appointment.html"><i data-lucide="calendar-check" aria-hidden="true"></i>Book appointment</a><a class="btn btn-ghost" data-tel href="#"><i data-lucide="phone" aria-hidden="true"></i>Ask the front desk</a></div>
        </div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
</body>
</html>
